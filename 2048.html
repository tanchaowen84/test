<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 经典小游戏</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      }
      .card {
        width: min(92vw, 460px);
        background: #111827;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 16px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #e5e7eb;
        margin-bottom: 12px;
      }
      .btn {
        border: 1px solid #4b5563;
        background: #1f2937;
        color: #f9fafb;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        background: #1f2937;
        padding: 8px;
        border-radius: 10px;
      }
      .cell {
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font-weight: 700;
        font-size: clamp(20px, 5vw, 28px);
        background: #334155;
        color: #e5e7eb;
        user-select: none;
      }
      .v0 { background:#334155; color:transparent; }
      .v2 { background:#f1f5f9; color:#0f172a; }
      .v4 { background:#e2e8f0; color:#0f172a; }
      .v8 { background:#fb923c; }
      .v16 { background:#f97316; }
      .v32 { background:#ef4444; }
      .v64 { background:#dc2626; }
      .v128 { background:#f59e0b; }
      .v256 { background:#eab308; }
      .v512 { background:#84cc16; }
      .v1024 { background:#22c55e; }
      .v2048 { background:#14b8a6; }
      .tip { margin-top: 10px; color: #9ca3af; font-size: 13px; }
      .mask {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0,0,0,.55);
      }
      .dialog {
        background: #111827;
        color: #fff;
        border: 1px solid #374151;
        border-radius: 12px;
        padding: 16px 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div>分数：<strong id="score">0</strong></div>
        <button class="btn" id="restart">重新开始</button>
      </div>
      <div class="board" id="board"></div>
      <div class="tip">方向键 / WASD 控制。目标：合成 2048。</div>
    </div>
    <div class="mask" id="mask">
      <div class="dialog">
        <div id="msg" style="margin-bottom:10px">游戏结束</div>
        <button class="btn" id="again">再来一局</button>
      </div>
    </div>

    <script>
      const size = 4;
      let grid = [];
      let score = 0;
      let won = false;

      const board = document.getElementById('board');
      const scoreEl = document.getElementById('score');
      const restartBtn = document.getElementById('restart');
      const mask = document.getElementById('mask');
      const msg = document.getElementById('msg');
      const again = document.getElementById('again');

      function init() {
        grid = Array.from({ length: size }, () => Array(size).fill(0));
        score = 0;
        won = false;
        scoreEl.textContent = score;
        hideMask();
        addRandom();
        addRandom();
        render();
      }

      function emptyCells() {
        const cells = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (grid[r][c] === 0) cells.push([r, c]);
          }
        }
        return cells;
      }

      function addRandom() {
        const empties = emptyCells();
        if (!empties.length) return;
        const [r, c] = empties[Math.floor(Math.random() * empties.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function render() {
        board.innerHTML = '';
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const v = grid[r][c];
            const div = document.createElement('div');
            div.className = `cell v${Math.min(v, 2048) || 0}`;
            div.textContent = v || '0';
            board.appendChild(div);
          }
        }
        scoreEl.textContent = score;
      }

      function slideLine(line) {
        const arr = line.filter(n => n !== 0);
        let add = 0;
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            add += arr[i];
            if (arr[i] === 2048) won = true;
            arr.splice(i + 1, 1);
          }
        }
        while (arr.length < size) arr.push(0);
        return [arr, add];
      }

      function rotateRight(mat) {
        const res = Array.from({ length: size }, () => Array(size).fill(0));
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) res[c][size - 1 - r] = mat[r][c];
        }
        return res;
      }

      function move(dir) {
        const old = JSON.stringify(grid);
        let turns = { left: 0, up: 3, right: 2, down: 1 }[dir];

        while (turns--) grid = rotateRight(grid);

        for (let r = 0; r < size; r++) {
          const [newLine, add] = slideLine(grid[r]);
          grid[r] = newLine;
          score += add;
        }

        turns = { left: 0, up: 1, right: 2, down: 3 }[dir];
        while (turns--) grid = rotateRight(grid);

        const changed = old !== JSON.stringify(grid);
        if (changed) addRandom();
        render();

        if (won) showMask('🎉 恭喜合成 2048！');
        else if (!canMove()) showMask('游戏结束');
      }

      function canMove() {
        if (emptyCells().length) return true;
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (r + 1 < size && grid[r][c] === grid[r + 1][c]) return true;
            if (c + 1 < size && grid[r][c] === grid[r][c + 1]) return true;
          }
        }
        return false;
      }

      function showMask(text) { msg.textContent = text; mask.style.display = 'grid'; }
      function hideMask() { mask.style.display = 'none'; }

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (["arrowleft", "a"].includes(k)) move('left');
        else if (["arrowright", "d"].includes(k)) move('right');
        else if (["arrowup", "w"].includes(k)) move('up');
        else if (["arrowdown", "s"].includes(k)) move('down');
        else return;
        e.preventDefault();
      });

      restartBtn.addEventListener('click', init);
      again.addEventListener('click', init);

      init();
    </script>
  </body>
</html>
