<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>经典小游戏 - 井字棋</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      padding: 20px;
    }
    .app {
      width: min(92vw, 520px);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 12px;
    }
    button.ctrl {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      color: #0b1220;
    }
    #startBtn { background: var(--ok); }
    #pauseBtn { background: var(--warn); }
    #restartBtn { background: var(--accent); }
    .meta {
      margin-left: auto;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .cell {
      border: 0;
      border-radius: 10px;
      aspect-ratio: 1 / 1;
      background: #1f2937;
      color: #f8fafc;
      font-size: clamp(34px, 8vw, 54px);
      font-weight: 800;
      cursor: pointer;
    }
    .cell:hover { filter: brightness(1.1); }
    .cell:disabled { cursor: not-allowed; opacity: 0.88; }
    .status {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      min-height: 20px;
    }
    .hint { margin-top: 8px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>⭕❌ 井字棋（Tic-Tac-Toe）</h1>
    <div class="toolbar">
      <button class="ctrl" id="startBtn">开始</button>
      <button class="ctrl" id="pauseBtn">暂停</button>
      <button class="ctrl" id="restartBtn">重开</button>
      <div class="meta">当前回合：<strong id="turn">X</strong></div>
    </div>

    <section class="board" id="board" aria-label="井字棋棋盘"></section>
    <div id="status" class="status">点击“开始”后对局开始。</div>
    <div class="hint">规则：X 先手，先连成一条线者胜；棋盘填满无人连线则平局。</div>
  </main>

  <script>
    (() => {
      const boardEl = document.getElementById('board');
      const statusEl = document.getElementById('status');
      const turnEl = document.getElementById('turn');

      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const restartBtn = document.getElementById('restartBtn');

      const WIN_LINES = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];

      let cells = Array(9).fill('');
      let turn = 'X';
      let started = false;
      let paused = false;
      let ended = false;

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function checkWinner() {
        for (const [a, b, c] of WIN_LINES) {
          if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return cells[a];
        }
        return '';
      }

      function isDraw() {
        return cells.every(v => v !== '');
      }

      function render() {
        boardEl.innerHTML = '';
        cells.forEach((value, i) => {
          const btn = document.createElement('button');
          btn.className = 'cell';
          btn.textContent = value;
          btn.disabled = !!value || !started || paused || ended;
          btn.addEventListener('click', () => move(i));
          boardEl.appendChild(btn);
        });
        turnEl.textContent = turn;
      }

      function move(index) {
        if (cells[index] || !started || paused || ended) return;
        cells[index] = turn;

        const winner = checkWinner();
        if (winner) {
          ended = true;
          setStatus(`对局结束：${winner} 获胜！`);
          render();
          return;
        }
        if (isDraw()) {
          ended = true;
          setStatus('对局结束：平局。');
          render();
          return;
        }

        turn = turn === 'X' ? 'O' : 'X';
        setStatus(`游戏进行中：轮到 ${turn}`);
        render();
      }

      function resetBoard(full = false) {
        cells = Array(9).fill('');
        turn = 'X';
        ended = false;
        if (full) {
          started = false;
          paused = false;
          setStatus('点击“开始”后对局开始。');
        } else {
          setStatus('游戏进行中：轮到 X');
        }
        render();
      }

      startBtn.addEventListener('click', () => {
        if (ended) resetBoard(false);
        started = true;
        paused = false;
        if (cells.every(v => v === '')) setStatus('游戏进行中：轮到 X');
        render();
      });

      pauseBtn.addEventListener('click', () => {
        if (!started || ended) return;
        paused = !paused;
        setStatus(paused ? '已暂停。点击“暂停”可继续。' : `游戏进行中：轮到 ${turn}`);
        render();
      });

      restartBtn.addEventListener('click', () => resetBoard(true));

      resetBoard(true);
    })();
  </script>
</body>
</html>
