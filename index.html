<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    body { margin: 0; background:#111; color:#eee; font-family: system-ui, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .wrap{ display:flex; gap:16px; align-items:flex-start; }
    canvas{ background:#000; border:2px solid #444; image-rendering: pixelated; }
    .panel{ min-width:160px; }
    button{ width:100%; padding:8px; margin-top:8px; border:none; background:#2c7; color:#021; font-weight:700; border-radius:6px; cursor:pointer; }
    .hint{ font-size:12px; opacity:.8; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="300" height="600"></canvas>
    <div class="panel">
      <h2>Tetris</h2>
      <p>Score: <strong id="score">0</strong></p>
      <button id="restart">Restart</button>
      <p class="hint">Controls:<br/>← → move<br/>↑ rotate<br/>↓ soft drop<br/>Space hard drop</p>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
