<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇小游戏</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      }
      .card {
        width: min(92vw, 480px);
        background: #111827;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        color: #e5e7eb;
      }
      .btn {
        border: 1px solid #4b5563;
        background: #1f2937;
        color: #f9fafb;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .btn:hover { background: #374151; }
      canvas {
        width: 100%;
        image-rendering: pixelated;
        border-radius: 10px;
        background: #0b1020;
        border: 1px solid #374151;
      }
      .tip {
        color: #9ca3af;
        margin-top: 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div>分数：<strong id="score">0</strong></div>
        <button class="btn" id="restart">重新开始</button>
      </div>
      <canvas id="game" width="400" height="400"></canvas>
      <div class="tip">方向键/WASD 控制，空格暂停。</div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const restartBtn = document.getElementById('restart');

      const grid = 20;
      const tile = canvas.width / grid;
      let snake, dir, nextDir, food, score, speed, timer, paused, gameOver;

      function randPos() {
        return { x: Math.floor(Math.random() * grid), y: Math.floor(Math.random() * grid) };
      }

      function reset() {
        snake = [{ x: 10, y: 10 }];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        food = randPos();
        score = 0;
        speed = 120;
        paused = false;
        gameOver = false;
        scoreEl.textContent = score;
        clearInterval(timer);
        timer = setInterval(loop, speed);
        draw();
      }

      function setDirection(x, y) {
        if (x === -dir.x && y === -dir.y) return;
        nextDir = { x, y };
      }

      function placeFood() {
        do {
          food = randPos();
        } while (snake.some(s => s.x === food.x && s.y === food.y));
      }

      function loop() {
        if (paused || gameOver) return;

        dir = nextDir;
        const head = {
          x: (snake[0].x + dir.x + grid) % grid,
          y: (snake[0].y + dir.y + grid) % grid,
        };

        if (snake.some(s => s.x === head.x && s.y === head.y)) {
          gameOver = true;
          draw();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          placeFood();
          if (speed > 70 && score % 50 === 0) {
            speed -= 10;
            clearInterval(timer);
            timer = setInterval(loop, speed);
          }
        } else {
          snake.pop();
        }

        draw();
      }

      function drawCell(x, y, color, radius = 5) {
        const px = x * tile;
        const py = y * tile;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(px + 1, py + 1, tile - 2, tile - 2, radius);
        ctx.fill();
      }

      function draw() {
        ctx.fillStyle = '#0b1020';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < snake.length; i++) {
          drawCell(snake[i].x, snake[i].y, i === 0 ? '#34d399' : '#10b981', 4);
        }

        drawCell(food.x, food.y, '#f87171', 8);

        if (paused || gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,.45)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.font = 'bold 30px sans-serif';
          ctx.fillText(gameOver ? '游戏结束' : '已暂停', canvas.width / 2, canvas.height / 2 - 8);
          ctx.font = '14px sans-serif';
          ctx.fillText(gameOver ? '按“重新开始”再来一局' : '按空格继续', canvas.width / 2, canvas.height / 2 + 20);
        }
      }

      window.addEventListener('keydown', (e) => {
        switch (e.key.toLowerCase()) {
          case 'arrowup':
          case 'w': setDirection(0, -1); break;
          case 'arrowdown':
          case 's': setDirection(0, 1); break;
          case 'arrowleft':
          case 'a': setDirection(-1, 0); break;
          case 'arrowright':
          case 'd': setDirection(1, 0); break;
          case ' ': paused = !paused; draw(); break;
          default: return;
        }
        e.preventDefault();
      });

      restartBtn.addEventListener('click', reset);
      reset();
    </script>
  </body>
</html>
